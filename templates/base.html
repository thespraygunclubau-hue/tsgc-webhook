<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TSGC Registry{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --border: #e4e2dd;
      --text: #1c1c1a;
      --muted: #6b6b66;
      --accent: #b3401a;
      --accent-hover: #92330f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
    }
    header .brand { font-weight: 700; letter-spacing: -0.01em; }
    header a { color: var(--muted); text-decoration: none; font-size: 14px; }
    header a:hover { color: var(--text); }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 16px;
    }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: var(--card);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .muted { color: var(--muted); font-size: 14px; }
    .error { color: var(--accent); font-size: 14px; margin-top: 8px; }
    a.result-link { display: block; text-decoration: none; color: inherit; }
    a.result-link .card:hover { border-color: var(--accent); }
    .name { font-weight: 600; font-size: 16px; }
    .badge { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; margin-left: 8px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 6px 0; font-size: 14px; vertical-align: top; }
    th { color: var(--muted); font-weight: 500; width: 140px; }
    .machine-card { margin-bottom: 12px; }
    .machine-title { font-weight: 600; margin-bottom: 6px; }
    .trello-link { display: inline-block; margin-top: 10px; font-size: 14px; color: var(--accent); text-decoration: none; }
    .trello-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="brand">TSGC Registry</span>
    {% if show_logout %}<a href="{{ url_for('logout') }}">Log out</a>{% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

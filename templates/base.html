<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}TSGC Registry{% endblock %}</title>

  <!-- iPad "Add to Home Screen" as a standalone app, with its own icon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TSGC Registry">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon-180.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --border: #e4e2dd;
      --text: #1c1c1a;
      --muted: #6b6b66;
      --accent: #ff4e4f;
      --accent-hover: #e63a3b;
      --brand-pink: #f1616f;
      --header-bg: #0a0a0a;
      --header-text: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--header-bg);
    }
    header .brand {
      font-family: 'Archivo Black', 'Inter', sans-serif;
      color: var(--header-text);
      letter-spacing: -0.01em;
      font-size: 18px;
    }
    header a { color: #cfcfcf; text-decoration: none; font-size: 14px; }
    header a:hover { color: var(--accent); }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    main.wide { max-width: 1240px; padding: 28px 24px 60px; }
    header .brand a { color: inherit; text-decoration: none; }
    header nav { display: flex; gap: 20px; align-items: center; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 16px;
    }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: var(--card);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .muted { color: var(--muted); font-size: 14px; }
    .error { color: var(--accent-hover); font-size: 14px; margin-top: 8px; }
    a.result-link { display: block; text-decoration: none; color: inherit; }
    a.result-link .card:hover { border-color: var(--accent); }
    .name { font-weight: 600; font-size: 16px; }
    .badge { display: inline-block; font-size: 12px; color: var(--brand-pink); border: 1px solid var(--brand-pink); border-radius: 999px; padding: 2px 10px; margin-left: 8px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 6px 0; font-size: 14px; vertical-align: top; }
    th { color: var(--muted); font-weight: 500; width: 140px; }
    .machine-card { margin-bottom: 12px; }
    .machine-title { font-weight: 600; margin-bottom: 6px; }
    .trello-link { display: inline-block; margin-top: 10px; font-size: 14px; color: var(--accent); text-decoration: none; font-weight: 600; }
    .trello-link:hover { text-decoration: underline; color: var(--accent-hover); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <span class="brand"><a href="{{ url_for('board') }}">TSGC REGISTRY</a></span>
    {% if show_logout %}<nav><a href="{{ url_for('board') }}">Customers</a><a href="{{ url_for('logout') }}">Log out</a></nav>{% endif %}
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script>
    // "Are you sure?" for any form with data-confirm (e.g. delete buttons),
    // including ones loaded into the customer pop-up after the page loads.
    document.addEventListener('submit', function (e) {
      var msg = e.target.getAttribute && e.target.getAttribute('data-confirm');
      if (msg && !window.confirm(msg)) e.preventDefault();
    }, true);

    // Edit / Cancel buttons: swap a section between view and edit form.
    // Delegated so it also works inside the customer pop-up.
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('[data-edit],[data-cancel]');
      if (!btn) return;
      var id = btn.getAttribute('data-edit') || btn.getAttribute('data-cancel');
      var editing = btn.hasAttribute('data-edit');
      var form = document.getElementById(id);
      var view = document.querySelector('[data-view="' + id + '"]');
      if (!form) return;
      if (!editing) form.reset();
      form.hidden = !editing;
      if (view) view.hidden = editing;
      if (editing) {
        var first = form.querySelector('input,select,textarea');
        if (first) first.focus();
      }
      syncType(form);
    });

    // Show Issue for Drop-Off, hire fields for Hire.
    function syncType(form) {
      var sel = form && form.querySelector('[data-type-switch]');
      if (!sel) return;
      var hire = sel.value === 'hire';
      form.querySelectorAll('.f-hire').forEach(function (el) { el.hidden = !hire; });
      form.querySelectorAll('.f-dropoff').forEach(function (el) { el.hidden = hire; });
    }
    document.addEventListener('change', function (e) {
      if (e.target.matches && e.target.matches('[data-type-switch]')) syncType(e.target.form);
    });
  </script>
</body>
</html>
